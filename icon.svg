<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="58%" cy="40%" r="75%">
      <stop offset="0" stop-color="#46705A"/>
      <stop offset=".55" stop-color="#2F4A3A"/>
      <stop offset="1" stop-color="#17281E"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7C9D6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F7C9D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE4EB"/>
      <stop offset="1" stop-color="#F2B3C4"/>
    </linearGradient>
    <linearGradient id="wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9D3DE"/>
      <stop offset="1" stop-color="#E58DAA"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9478C"/>
      <stop offset="1" stop-color="#8E2A60"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="278" cy="226" r="210" fill="url(#glow)"/>

  <!-- leaves -->
  <path d="M60 512 C70 420 150 360 250 372 C200 410 150 460 132 512Z" fill="#6E9A5C"/>
  <path d="M512 470 C470 390 380 360 300 384 C360 410 410 450 430 512 L512 512Z" fill="#5E8A44"/>
  <path d="M120 512 C150 440 210 400 270 392" fill="none" stroke="#4E7A3A" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- stem -->
  <path d="M168 500 C150 400 170 300 238 250" fill="none" stroke="#8FAE88" stroke-width="10" stroke-linecap="round"/>
  <path d="M198 330 C215 300 240 288 262 292" fill="none" stroke="#8FAE88" stroke-width="6" stroke-linecap="round"/>
  <!-- bud -->
  <ellipse cx="270" cy="292" rx="17" ry="11" fill="#F2B3C4" transform="rotate(-20 270 292)"/>
  <ellipse cx="266" cy="289" rx="6" ry="3.5" fill="#FCE4EB" transform="rotate(-20 266 289)"/>

  <!-- orchid bloom -->
  <g transform="translate(286 214)">
    <!-- sepals -->
    <ellipse rx="34" ry="96" cy="-70" fill="url(#petal)" transform="rotate(-6)"/>
    <ellipse rx="30" ry="90" cy="-62" fill="url(#petal)" transform="rotate(118)"/>
    <ellipse rx="30" ry="90" cy="-62" fill="url(#petal)" transform="rotate(-128)"/>
    <!-- wide petals -->
    <ellipse rx="62" ry="86" cx="-74" cy="-14" fill="url(#wide)" transform="rotate(-24)"/>
    <ellipse rx="62" ry="86" cx="74" cy="-14" fill="url(#wide)" transform="rotate(24)"/>
    <!-- veins -->
    <path d="M-10 -10 C-50 -30 -90 -50 -118 -60 M-12 4 C-60 -4 -100 -10 -130 -8 M10 -10 C50 -30 90 -50 118 -60 M12 4 C60 -4 100 -10 130 -8" fill="none" stroke="#D96E97" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <!-- lip -->
    <path d="M-34 18 C-50 52 -30 96 0 100 C30 96 50 52 34 18 C20 30 -20 30 -34 18Z" fill="url(#lip)"/>
    <path d="M-20 34 C-14 60 -6 76 0 84 C6 76 14 60 20 34" fill="none" stroke="#F2B3C4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <!-- column -->
    <ellipse cx="0" cy="4" rx="16" ry="20" fill="#FFF6E8"/>
    <ellipse cx="0" cy="12" rx="9" ry="8" fill="#FFD24A"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFF3C4">
    <circle cx="420" cy="96" r="5"/>
    <circle cx="452" cy="150" r="3"/>
    <circle cx="96" cy="128" r="4"/>
    <circle cx="140" cy="84" r="2.5"/>
  </g>
</svg>
