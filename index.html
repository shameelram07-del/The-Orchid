<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Orchid</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Orchid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15231B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The Orchid. Phone-first garden app. Bottom bar: This week + plant categories. Category view: swipe through plant pages (scroll-snap). Data: db collections plants, weeks, ticks. */
:root{
  --bg:#FBF4EF; --band:#F7E4E6; --surface:#FFFFFF; --muted-surface:#F4EDE6; --ink:#2F4A3A; --body:#4E3B45; --muted:#6B5D63; --line:#EACDD3;
  --accent:#B23A7A; --accent-strong:#A3336F; --accent-ink:#FFFFFF; --deep:#2F4A3A; --deep-ink:#FBF4EF; --deep-muted:#C7D6C1; --done:#9A8C92;
  --shadow:rgba(78,59,69,.35); --glass:rgba(255,255,255,.9); --plate-ink:#4E3B45;
  --serif:"Fraunces",Georgia,serif; --grot:"Bricolage Grotesque",system-ui,sans-serif; --sans:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15231B; --band:#1C2E23; --surface:#22372A; --muted-surface:#2B4234; --ink:#F3ECE6; --body:#E6D9DF; --muted:#BFB2B8; --line:#3A5244;
    --accent:#E58DBE; --accent-strong:#F0A6CE; --accent-ink:#2A0E1E; --deep:#0E1913; --deep-ink:#F3ECE6; --deep-muted:#B9CBB2; --done:#7D8F84;
    --shadow:rgba(0,0,0,.5); --glass:rgba(34,55,42,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15231B; --band:#1C2E23; --surface:#22372A; --muted-surface:#2B4234; --ink:#F3ECE6; --body:#E6D9DF; --muted:#BFB2B8; --line:#3A5244;
  --accent:#E58DBE; --accent-strong:#F0A6CE; --accent-ink:#2A0E1E; --deep:#0E1913; --deep-ink:#F3ECE6; --deep-muted:#B9CBB2; --done:#7D8F84;
  --shadow:rgba(0,0,0,.5); --glass:rgba(34,55,42,.9); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.serif{font-family:var(--serif);font-variation-settings:"SOFT" 100}
.grot{font-family:var(--grot)}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(118px + env(safe-area-inset-bottom));overflow:hidden}

/* Header */
.top{padding:calc(16px + env(safe-area-inset-top)) 20px 6px;display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--serif);font-style:italic;font-weight:600;font-size:19px}
.pillbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:15px;font-weight:700;cursor:pointer}
.titlerow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:6px}
h1{margin:0;font-family:var(--serif);font-variation-settings:"SOFT" 100;font-weight:400;font-size:clamp(40px,13vw,52px);line-height:.92;letter-spacing:-.03em}
h1 em{font-style:italic;color:var(--accent)}
h1.long{font-size:clamp(32px,10vw,42px)}
@media (max-width:360px){.petrow .petchip{flex-direction:column;align-items:flex-start;gap:3px;padding:8px}.tabs .bar .tab{flex:1 1 0;min-width:38px}.tabs .bar .tab svg{width:26px;height:26px}.tiles .tile span{font-size:12px}}
.pos{margin:0 0 4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Rail + plant page */
.rail{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:6px 16px 0;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{margin:0 4px;display:flex;justify-content:space-between;font-family:var(--grot);font-weight:800;font-size:14px;letter-spacing:.06em}
.plate{position:relative;border-radius:190px 190px 32px 32px;padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.plate .art{width:220px;height:220px;position:relative;z-index:0;overflow:visible;filter:drop-shadow(0 16px 14px rgba(47,74,58,.18))}
.giant{margin:-50px 0 0;position:relative;z-index:1;text-shadow:3px 0 0 var(--halo),-3px 0 0 var(--halo),0 3px 0 var(--halo),0 -3px 0 var(--halo),2px 2px 0 var(--halo),-2px 2px 0 var(--halo),2px -2px 0 var(--halo),-2px -2px 0 var(--halo),0 0 10px var(--halo),0 0 18px var(--halo);font-family:var(--grot);font-weight:800;line-height:.84;letter-spacing:-.05em;text-transform:uppercase;overflow-wrap:anywhere}
.latin{margin:12px 0 0;font-family:var(--serif);font-style:italic;font-size:18px}
.spot{margin:8px 0 0;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4E3B45;background:rgba(255,255,255,.72);border-radius:999px;padding:4px 12px}
.card{background:var(--surface);border-radius:24px;box-shadow:0 8px 22px -16px var(--shadow)}
.jobs{list-style:none;margin:0;padding:6px 0}
.job{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer}
.job input{width:26px;height:26px;margin:1px 0 0;flex:none;accent-color:var(--accent);cursor:pointer}
.job .k{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong)}
.job .t{transition:color .3s}
.job.done .t{color:var(--done);text-decoration:line-through}
.job.done .k{color:var(--done)}
.none{padding:14px 16px;margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat .h{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:15px;line-height:1.3}
.season{padding:16px;display:flex;flex-direction:column;gap:10px}
.season .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.season h3{margin:0;font-family:var(--serif);font-weight:600;font-size:20px}
.season .row span{font-size:13px;color:var(--muted);text-align:right}
.months{display:flex;gap:3px}
.months span{flex:1;height:32px;display:grid;place-items:center;border-radius:9px;font-size:12px;font-weight:700;background:var(--muted-surface);color:var(--muted)}
.months span.now{box-shadow:inset 0 0 0 2px var(--ink)}
.about{padding:4px 6px;display:flex;flex-direction:column;gap:6px}
.about h3{margin:0;font-family:var(--serif);font-weight:400;font-style:italic;font-size:26px;line-height:1}
.about p{margin:0;color:var(--body)}
.watch{background:var(--band);border-radius:24px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.next{background:var(--deep);color:var(--deep-ink);border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next .label{color:var(--deep-muted)}
.pending{color:var(--muted);font-style:italic}
.pets{padding:14px;display:flex;flex-direction:column;gap:10px}
.petrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.petchip{display:flex;align-items:center;gap:7px;border-radius:16px;padding:10px 8px;font-weight:700;font-size:14px;line-height:1.15;min-width:0}
.petchip svg{flex:none}
.pk{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.petnote{margin:0;font-size:15px;color:var(--body)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:20px;text-decoration:none;min-height:64px}
.tile b{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1}
.tile span{font-size:13px;font-weight:700}
.alert{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:opacity .3s}
.alert.done{opacity:.55}
.alert.done h3{text-decoration:line-through}
.alert p{margin:0}
.ahead{display:flex;align-items:center;gap:12px}
.alert .badge{width:48px;height:48px}.alert .badge svg{width:38px;height:38px}
.lvl{display:inline-block;color:#FFFFFF;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-bottom:4px}
.alert h3{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15}
.todo{font-size:16px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sorted{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}
.sorted input{width:24px;height:24px;margin:0;accent-color:currentColor}
.titlebtn{all:unset;cursor:pointer;border-radius:12px}
.titlebtn:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.titlebtn h1{display:inline-flex;align-items:center;gap:6px}
.chev{flex:none;color:var(--accent);margin-top:8px}
.pkh{margin:6px 0 0;font-family:var(--serif);font-weight:600;font-size:20px;display:flex;align-items:baseline;gap:8px}
.pkh span{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted)}
.pkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk{border:0;border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#2F4A3A;font-size:13px;font-weight:700;line-height:1.15;text-align:center;min-height:96px}
.pk svg{width:52px;height:52px;overflow:visible}
.remove{align-self:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:6px}
.dots{display:flex;justify-content:center;gap:2px;padding:12px 0 2px}
.dots button{width:28px;height:28px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer}
.dots i{display:block;width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .3s,background .3s}
.dots button[aria-current="true"] i{width:24px;background:var(--accent)}

/* This week */
.lede{margin:0;max-width:300px;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.25;color:var(--body)}
.weather{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.ringcard{display:flex;align-items:center;gap:16px;padding:16px}
.ring{width:78px;height:78px;position:relative;flex:none}
.ring svg{width:78px;height:78px;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray .6s cubic-bezier(.2,.7,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.ring b small{font-size:13px;color:var(--muted);font-weight:400}
.mood{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15}
.sub{margin:0;font-size:14px;color:var(--muted)}
.wk{padding:6px 16px 0;display:flex;flex-direction:column;gap:14px}
.sechead{display:flex;align-items:center;gap:10px;margin:10px 4px 0}
.sechead h2{margin:0;font-family:var(--serif);font-weight:400;font-style:italic;font-size:30px;line-height:1}
.sechead span{margin-left:auto;font-size:14px;color:var(--muted)}
.pcard .head{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}
.badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge svg{width:44px;height:44px;overflow:visible}
.pcard h3{margin:0;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.05}
.open{margin-left:auto;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;cursor:pointer;color:var(--accent-strong);font-weight:700}
.resting{margin:0 4px;font-size:14px;color:var(--muted)}
.empty{padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty p{margin:0}

/* Bottom bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(492px,calc(100% - 24px));border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 30px -10px var(--shadow);padding:6px;z-index:10}
.tabs .bar{display:flex;gap:2px;overflow-x:auto;align-items:center;scrollbar-width:none}
.tabs .bar::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;min-width:46px;padding:0;border:0;border-radius:999px;background:transparent;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;transition:background .3s,color .3s,padding .3s}
.tab svg{width:30px;height:30px;overflow:visible}
.tab .nm{display:none}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tabs .bar{justify-content:space-between}
.tab.add{color:var(--accent-strong)}

/* Sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:92vh;border-radius:32px 32px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -10px 40px -10px var(--shadow)}
dialog::backdrop{background:rgba(30,20,26,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog[open]{animation:sheet .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet{padding:12px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.sheet h2 em{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0}
.field label,.field legend{font-size:14px;font-weight:700;color:var(--body);padding:0}
.field input[type=text]{min-height:50px;border:1px solid var(--line);border-radius:16px;padding:0 14px;background:var(--surface);font-size:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.opt span svg{width:28px;height:28px;overflow:visible}
.opt input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:flex;gap:10px}.row2 > *{flex:1}
.bigbtn{min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;cursor:pointer}
.ghost{min-height:52px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.err{margin:0;color:var(--accent-strong);font-size:14px}

/* Motion */
.a-swing{transform-box:fill-box;transform-origin:56% 8%;animation:swing 4.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-bob{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(3px)}50%{transform:translateY(-6px)}}
.a-roll{transform-box:fill-box;transform-origin:50% 56%;animation:roll 6s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translateX(-4px) rotate(-12deg)}50%{transform:translateX(4px) rotate(12deg)}}
.a-bounce{transform-box:fill-box;transform-origin:50% 92%;animation:bounce 2.4s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.06,.94)}40%{transform:translateY(-10px) scale(.97,1.03)}70%{transform:translateY(0) scale(1.03,.97)}}
.a-wiggle{transform-box:fill-box;transform-origin:50% 10%;animation:wiggle 3.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.a-sway{transform-box:fill-box;transform-origin:50% 100%;animation:psway 5s ease-in-out infinite}
@keyframes psway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.a-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05,1.08)}}
.shine{animation:shine 3s ease-in-out infinite}.twinkle{animation:shine 1.8s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.35}50%{opacity:.95}}
.nudge{animation:nudge 2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.view{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rail{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<nav class="tabs" aria-label="Categories"><div class="bar" id="bar"></div></nav>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="sheet" id="sheetBody"></div></dialog>

<script>
/* ---------- Drawings (one per plant, drawn for The Orchid) ---------- */
const petals = (n, rx, ry, cy) => Array.from({ length: n }, (_, i) => `<ellipse cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${(360 / n * i).toFixed(1)})"/>`).join('');
const whorl = (a, b) => Array.from({ length: 7 }, (_, i) => `<ellipse cy="-11" rx="4.5" ry="11" fill="${i % 2 ? b : a}" transform="rotate(${Math.round(360 / 7 * i)})"/>`).join('');

};

/* ---------- Views ---------- */
const giantSize = name => {
  const words = String(name).toUpperCase().split(/\s+/).filter(Boolean), W = 322;
  const fits = (px, maxLines) => { const cw = 0.64 * px, sp = 0.28 * px; let lines = 1, cur = 0; for (const w of words) { const ww = w.length * cw; if (ww > W) return false; if (!cur) cur = ww; else if (cur + sp + ww <= W) cur += sp + ww; else { lines++; cur = ww; } } return lines <= maxLines; };
  let px = 0; for (let t = 100; t >= 30; t -= 2) if (fits(t, 1)) { px = t; break; }
  if (px < 60) { const cap = 80; px = 30; for (let t = cap; t >= 30; t -= 2) if (fits(t, 2)) { px = t; break; } }
  return `min(${px}px, ${(px / 3.93).toFixed(1)}vw)`;
};
const pad2 = n => String(n).padStart(2, '0');

function topBar(title, right) {
  return `<header class="top">
    <div class="toprow"><p class="brand">${ICON.orchid}The Orchid</p>${right || ''}</div>
    <div class="titlerow">${title}</div></header>`;
}

const PET_LV = { safe: ['Safe', '#E3EDE0', '#24492E'], care: ['Careful', '#FCEBD0', '#6E420A'], toxic: ['Keep away', '#FADADF', '#7E1A33'] };
function petStrip(p) {
  const pets = p.pets; if (!pets || typeof pets !== 'object') return '';
  const chip = (k, icon, label) => { const lv = PET_LV[pets[k]]; return lv ? `<span class="petchip" style="background:${lv[1]};color:${lv[2]}">${icon}<span><span class="pk">${label}</span>${lv[0]}</span></span>` : ''; };
  return `<section class="card pets"><span class="label" style="color:var(--muted)">Pet safety</span><div class="petrow">${chip('cat', ICON.cat, 'Cats')}${chip('dog', ICON.dog, 'Dog')}${chip('bird', ICON.bird, 'Birds')}</div>${p.petNote ? `<p class="petnote">${esc(p.petNote)}</p>` : ''}</section>`;
}

const lum = h => { const n = parseInt(h.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
// Darken a title colour until it reads clearly on its plate (at least 6:1).
function readable(deep, tint) {
  let c = deep;
  for (let k = 0; k < 30 && contrast(c, tint) < 6; k++) { const n = parseInt(c.slice(1), 16); c = '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * .9).toString(16).padStart(2, '0')).join(''); }
  return c;
}

function plantPage(p, i, n, c) {
  const tint = HEX.test(p.tint || '') ? p.tint : c.tint, deep = readable(HEX.test(p.deep || '') ? p.deep : c.deep, tint);
  const jobs = jobsFor(p.id);
  const months = Array.isArray(p.months) ? p.months : [];
  const pend = '<span class="pending">Filled in on Saturday</span>';
  const v = x => x ? esc(x) : pend;
  return `<article class="page" aria-label="${esc(p.name)}, ${i + 1} of ${n}">
    <p class="meta" style="color:${deep}"><span>${pad2(i + 1)} / ${pad2(n)}</span><span style="text-transform:uppercase">${esc(subName(c, p.sub) || c.name)}</span></p>
    <section class="plate" style="background:${tint};--halo:${tint}">
      ${svgArt(p.art)}
      <h2 class="giant" style="color:${deep};font-size:${giantSize(p.name)}">${esc(p.name)}</h2>
      ${p.latin ? `<p class="latin" style="color:${deep}">${esc(p.latin)}</p>` : ''}
      ${p.spot ? `<p class="spot">${ICON.pin}${esc(p.spot)}</p>` : ''}
    </section>
    ${petStrip(p)}
    <div class="card"><ul class="jobs">${jobs.length ? jobs.map(t => { const on = !!S.ticks[t.id]; return `<li><label class="job${on ? ' done' : ''}"><input type="checkbox" data-task="${esc(t.id)}" ${on ? 'checked' : ''}><span><span class="k">This week · ${esc(t.tag || 'Job')}</span><span class="t">${esc(t.text)}</span></span></label></li>`; }).join('') : '<li><p class="none">Nothing needed this week. Enjoy it.</p></li>'}</ul></div>
    <div class="stats">
      <div class="stat"><span class="h">${ICON.sun}Light</span><span class="v">${v(p.sun)}</span></div>
      <div class="stat"><span class="h">${ICON.water}Water</span><span class="v">${v(p.water)}</span></div>
      <div class="stat"><span class="h">${ICON.feed}Feed</span><span class="v">${v(p.feed)}</span></div>
      <div class="stat"><span class="h">${ICON.care}Care</span><span class="v">${v(p.care)}</span></div>
    </div>
    ${months.length ? `<section class="card season"><div class="row"><h3>${esc(p.season || 'Season')}</h3><span>${esc(p.seasonText || '')}</span></div>
      <div class="months" role="img" aria-label="${esc((p.season || 'Season') + ': ' + (p.seasonText || ''))}">${ML.map((l, m) => months.includes(m) ? `<span class="${m === NOW ? 'now' : ''}" style="background:${deep};color:#FFFFFF">${l}</span>` : `<span class="${m === NOW ? 'now' : ''}">${l}</span>`).join('')}</div>
      <p class="sub" style="font-size:12px">Outlined month = now</p></section>` : ''}
    <section class="about"><h3>About your ${esc(p.short || p.name)}</h3><p>${p.about ? esc(p.about) : pend}</p></section>
    ${p.watch ? `<section class="watch">${ICON.lens}<span><span class="label" style="color:var(--accent-strong)">Watch for</span>${esc(p.watch)}</span></section>` : ''}
    ${p.next ? `<section class="next"><span><span class="label">Coming up</span>${esc(p.next)}</span><span class="nudge" style="flex:none;width:44px;height:44px;border-radius:50%;background:${tint};color:#2F4A3A;display:grid;place-items:center">${ICON.arrow}</span></section>` : ''}
  </article>`;
}

function openPicker(k) {
  const c = cat(k), ps = plantsIn(k);
  const groups = [...(c.subs || []), ['', 'Other']].map(([sk, sn]) => {
    const list = ps.map((p, i) => [p, i]).filter(([p]) => sk ? p.sub === sk : subIdx(c, p.sub) === 99);
    if (!list.length) return '';
    return `<h3 class="pkh">${esc(sn)} <span>${list.length}</span></h3><div class="pkgrid">${list.map(([p, i]) => `<button type="button" class="pk" data-pick="${i}" style="background:${HEX.test(p.tint || '') ? p.tint : c.tint}">${svgArt(p.art, '')}<span>${esc(p.name)}</span></button>`).join('')}</div>`;
  }).join('');
  sheetBody.innerHTML = `<span class="grab" aria-hidden="true"></span><h2 id="sheetTitle">All <em>${esc(c.name.toLowerCase())}</em></h2><p class="sub" style="margin-top:-8px">${ps.length} plants · tap one to jump to it</p>${groups}<button type="button" class="ghost" data-close>Close</button>`;
  sheet.dataset.pkcat = k;
  sheet.showModal();
}

function catView(k) {
  const c = cat(k), ps = plantsIn(k), n = ps.length;
  const i = Math.min(S.idx[k] || 0, Math.max(0, n - 1));
  const head = topBar(`<button type="button" class="titlebtn" data-picker="${k}" aria-label="Show all ${esc(c.name)} plants"><h1${c.name.length > 8 ? ' class="long"' : ''}>My <em>${esc(c.name)}</em><svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></h1></button><p class="pos" id="pos">${n ? `${i + 1} of ${n}` : ''}</p>`, '');
  if (!n) return head + `<div class="wk"><div class="card empty">${svgArt(c.art, 'art')}<p class="serif" style="font-size:22px">No ${esc(c.name.toLowerCase())} yet</p></div></div>`;
  return head + `<div class="rail" id="rail" aria-label="${esc(c.name)}: swipe sideways for the next plant">${ps.map((p, j) => plantPage(p, j, n, c)).join('')}</div>
    <div class="dots" id="dots">${ps.map((p, j) => `<button type="button" data-go="${j}" aria-label="Go to ${esc(p.name)}" aria-current="${j === i}"><i></i></button>`).join('')}</div>`;
}

const LV = {
  critical: { name: 'Critical', sub: 'Act now', bg: '#FCE1E5', ink: '#5E1226', chip: '#B3203C' },
  issue: { name: 'Issues', sub: 'Happening now', bg: '#FCEBD0', ink: '#5A3608', chip: '#8F5208' },
  risk: { name: 'Could happen', sub: 'Get ahead of it', bg: '#ECE4F6', ink: '#3A2A58', chip: '#6B4E9A' }
};
function alertCard(al, byId) {
  const L = LV[al.level] || LV.risk, p = byId[al.plantId], on = !!S.ticks[al.id];
  const art = p ? p.art : (al.art || 'flower');
  return `<section class="alert${on ? ' done' : ''}" style="background:${L.bg};color:${L.ink}">
    <div class="ahead"><span class="badge" style="background:rgba(255,255,255,.7)">${svgArt(art, '')}</span>
      <div><span class="lvl" style="background:${L.chip}">${L.name}${p ? ' · ' + esc(p.name) : ''}</span><h3>${esc(al.title)}</h3></div></div>
    ${al.text ? `<p>${esc(al.text)}</p>` : ''}
    ${al.action ? `<p class="todo"><b>What to do:</b> ${esc(al.action)}</p>` : ''}
    <div class="arow"><label class="sorted"><input type="checkbox" data-task="${esc(al.id)}" ${on ? 'checked' : ''}>Sorted</label>${p ? `<button type="button" class="open" data-open="${esc(p.id)}" style="color:${L.ink};border-color:rgba(0,0,0,.18)">Open plant</button>` : ''}</div>
  </section>`;
}

function weekView() {
  const kicker = `${SEASON(NOW)} · Auckland`;
  const head = (t, extra) => topBar(`<h1>Garden <em>watch</em></h1>`, `<span class="sub">${esc(t)}</span>`) + `<div class="wk">${extra}</div>`;
  if (!S.ready) return head(kicker, '<p class="lede">Checking the garden…</p>');
  if (!S.db && !S.ro) return head(kicker, '<div class="card empty"><p class="serif" style="font-size:22px">Open The Orchid in the Claude app to see your garden.</p></div>');
  const w = S.week;
  if (!w) return head(kicker, '<div class="card empty"><p class="serif" style="font-size:22px">Your first garden check arrives on Saturday morning.</p></div>');
  const byId = Object.fromEntries(S.plants.map(p => [p.id, p]));
  const alerts = (Array.isArray(w.alerts) ? w.alerts : []).filter(a => a && a.id && a.title);
  const tasks = (w.tasks || []).filter(t => t && t.text);
  const done = tasks.filter(t => S.ticks[t.id]).length, pct = tasks.length ? done / tasks.length : 0;
  const d = new Date((w.weekOf || w.id) + 'T12:00:00');
  const wk = isNaN(d) ? kicker : `Week of ${d.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' })}`;
  const open = lv => alerts.filter(a => (a.level || 'risk') === lv && !S.ticks[a.id]).length;
  const tiles = ['critical', 'issue', 'risk'].map(lv => `<a class="tile" href="#lv-${lv}" style="background:${LV[lv].bg};color:${LV[lv].ink}"><b>${open(lv)}</b><span>${LV[lv].name}</span></a>`).join('');
  const sections = ['critical', 'issue', 'risk'].map(lv => {
    const list = alerts.filter(a => (a.level || 'risk') === lv).sort((x, y) => (!!S.ticks[x.id]) - (!!S.ticks[y.id]));
    if (!list.length) return '';
    return `<div class="sechead" id="lv-${lv}"><h2>${LV[lv].name}</h2><span>${LV[lv].sub}</span></div>${list.map(a => alertCard(a, byId)).join('')}`;
  }).join('');
  const next = Array.isArray(w.next) && w.next.length ? `<section class="next" style="flex-direction:column;align-items:flex-start"><span class="label">Coming up${w.nextTitle ? ' · ' + esc(w.nextTitle) : ''}</span><ul style="margin:0;padding-left:18px;color:var(--deep-muted)">${w.next.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : '';
  return head(wk, `${w.headline ? `<p class="lede">${esc(w.headline)}</p>` : ''}
    ${w.weather ? `<p class="weather">${esc(w.weather)}</p>` : ''}
    ${alerts.length ? `<div class="tiles">${tiles}</div>` : ''}
    ${sections || '<div class="card empty"><p class="serif" style="font-size:22px">All clear. Nothing urgent this week.</p></div>'}
    <div class="card ringcard"><div class="ring"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--band)" stroke-width="3.5"/><circle class="arc" cx="18" cy="18" r="15.5" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="${(pct * 100).toFixed(1)} 100"/></svg><b><span>${done}<small>/${tasks.length}</small></span></b></div>
      <div><p class="mood">Weekly jobs</p><p class="sub">Each plant's jobs are on its own page. Tap a category below.</p></div></div>
    ${next}`);
}

function renderBar() {
  const shown = CATS.filter(c => plantsIn(c.k).length);
  const items = [{ k: 'week', name: 'Garden watch', icon: ICON.orchid.replace('width="26" height="26"', 'width="30" height="30"').replace('var(--accent)', 'currentColor') }, ...shown.map(c => ({ k: c.k, name: c.name, icon: svgArt(c.art, '') }))];
  if (!items.some(x => x.k === S.view)) items.push({ k: S.view, name: cat(S.view).name, icon: svgArt(cat(S.view).art, '') });
  bar.innerHTML = items.map(x => `<button type="button" class="tab" data-view="${x.k}" aria-label="${esc(x.name)}" ${x.k === S.view ? 'aria-current="page"' : ''}>${x.icon}<span class="nm">${esc(x.name)}</span></button>`).join('')
    ;
  const cur = bar.querySelector('[aria-current="page"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function render() {
  const fresh = S.lastView !== S.view; S.lastView = S.view;
  app.innerHTML = `<div class="${fresh ? 'view' : ''}">${S.view === 'week' ? weekView() : catView(S.view)}</div>`;
  renderBar();
  clearTimeout(S.syncT);
  const rail = document.getElementById('rail');
  if (rail) {
    const i = S.idx[S.view] || 0;
    rail.scrollLeft = i * rail.clientWidth;
    rail.addEventListener('scroll', () => { clearTimeout(S.syncT); S.syncT = setTimeout(() => syncIdx(rail), 60); }, { passive: true });
  }
}
function syncIdx(rail) {
  if (!rail.isConnected || rail !== document.getElementById('rail') || !rail.clientWidth) return;
  const i = Math.min(Math.round(rail.scrollLeft / rail.clientWidth), rail.children.length - 1), n = rail.children.length;
  S.idx[S.view] = i;
  const pos = document.getElementById('pos'); if (pos) pos.textContent = `${i + 1} of ${n}`;
  document.querySelectorAll('#dots button').forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
}
function go(view, i) { S.view = view; if (i != null) S.idx[view] = i; render(); window.scrollTo({ top: 0 }); }

/* ---------- Sheet: add plant ---------- */
function openAdd(k0) {
  const k = k0 && CATS.some(c => c.k === k0) ? k0 : (S.view !== 'week' ? S.view : 'fruit');
  sheetBody.innerHTML = `<span class="grab" aria-hidden="true"></span><h2 id="sheetTitle">New <em>plant</em></h2>
    <form id="addForm" class="sheet" style="padding:0">
      <div class="field"><label for="pName">Name</label><input id="pName" type="text" required maxlength="40" autocomplete="off" placeholder="e.g. Iceberg rose, Kentia palm"></div>
      <fieldset class="field"><legend>Category</legend><div class="opts" id="catOpts">${CATS.map(c => `<label class="opt"><input type="radio" name="cat" value="${c.k}" ${c.k === k ? 'checked' : ''}><span>${svgArt(c.art, '')}${c.name}</span></label>`).join('')}</div></fieldset>
      <fieldset class="field"><legend>Drawing</legend><div class="opts" id="artOpts"></div></fieldset>
      <div class="field"><label for="pSpot">Where is it? (optional)</label><input id="pSpot" type="text" maxlength="50" placeholder="e.g. Pot by the deck"></div>
      <p class="sub">Care details (light, water, feeding, season) are filled in automatically on Saturday.</p>
      <p class="err" id="addErr" role="alert"></p>
      <div class="row2"><button type="button" class="ghost" data-close>Cancel</button><button type="submit" class="bigbtn">Add plant</button></div>
    </form>`;
  const fill = () => { const c = cat(sheetBody.querySelector('input[name=cat]:checked').value); sheetBody.querySelector('#artOpts').innerHTML = c.arts.map((a, i) => `<label class="opt"><input type="radio" name="art" value="${a}" ${i === 0 ? 'checked' : ''}><span>${svgArt(a, '')}${ART_LABEL[a]}</span></label>`).join(''); };
  fill();
  sheetBody.querySelector('#catOpts').addEventListener('change', fill);
  sheetBody.querySelector('#addForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = sheetBody.querySelector('#pName').value.trim(); if (!name || !S.db) return;
    const k2 = sheetBody.querySelector('input[name=cat]:checked').value, c = cat(k2);
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      const ref = await S.db.collection('plants').add({ name, section: k2, art: sheetBody.querySelector('input[name=art]:checked').value, tint: c.tint, deep: c.deep, spot: sheetBody.querySelector('#pSpot').value.trim(), addedAt: new Date().toISOString() });
      sheet.close(); S.focus = ref && ref.id; S.idx[k2] = plantsIn(k2).length; go(k2);
    } catch (err) {
      sheetBody.querySelector('#addErr').textContent = err && err.code === 'quota_exceeded' ? 'The garden is full. Remove a plant first.' : 'Could not save. Check your connection and try again.';
      if (btn) btn.disabled = false;
    }
  });
  sheet.showModal();
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const v = e.target.closest('[data-view]'); if (v) { go(v.dataset.view); return; }
  const a = e.target.closest('[data-add]'); if (a) { if (S.ro) { const k = a.dataset.add || (S.view !== 'week' ? S.view : 'fruit'); window.open(formUrl('add-plant.yml', { title: 'Add plant', category: FORM_CAT[k] || 'Fruit' }), '_blank', 'noopener'); } else openAdd(a.dataset.add); return; }
  const o = e.target.closest('[data-open]'); if (o) { const p = S.plants.find(x => x.id === o.dataset.open); if (p) go(catOf(p), plantsIn(catOf(p)).indexOf(p)); return; }
  const g = e.target.closest('[data-go]'); if (g) { const rail = document.getElementById('rail'); if (rail) rail.scrollTo({ left: Number(g.dataset.go) * rail.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  const pi = e.target.closest('[data-pick]'); if (pi) { sheet.close(); go(sheet.dataset.pkcat, Number(pi.dataset.pick)); return; }
  const pk = e.target.closest('[data-picker]'); if (pk) { openPicker(pk.dataset.picker); return; }
  if (e.target === sheet || e.target.closest('[data-close]')) { sheet.close(); return; }
  const r = e.target.closest('[data-remove]');
  if (r && S.ro) { const pl = S.plants.find(x => x.id === r.dataset.remove); window.open(formUrl('remove-plant.yml', { title: 'Remove plant', plant: pl ? pl.name : '' }), '_blank', 'noopener'); return; }
  if (r && S.db) {
    if (r.dataset.confirm !== '1') { r.dataset.confirm = '1'; r.textContent = 'Tap again to remove'; return; }
    try { await S.db.doc('plants/' + r.dataset.remove).delete(); S.idx[S.view] = Math.max(0, (S.idx[S.view] || 0) - 1); } catch (err) { r.textContent = 'Could not remove'; }
  }
});
app.addEventListener('change', async e => {
  const cb = e.target.closest('input[data-task]'); if (!cb || (!S.db && !S.ro) || !S.week) return;
  const ticks = { ...S.ticks }; if (cb.checked) ticks[cb.dataset.task] = true; else delete ticks[cb.dataset.task];
  S.ticks = ticks; const row = cb.closest('.job, .alert'); if (row) row.classList.toggle('done', cb.checked);
  if (S.view === 'week') render();
  if (S.ro) { try { localStorage.setItem('orchid-ticks:' + S.week.id, JSON.stringify(ticks)); } catch (err) {} return; }
  try { await S.db.doc('ticks/' + S.week.id).set({ done: ticks, at: new Date().toISOString() }); } catch (err) { /* the snapshot restores saved state */ }
});

/* ---------- Data ---------- */
let pendingRender = null;
const softRender = () => { clearTimeout(pendingRender); pendingRender = setTimeout(render, 30); };
render();
(async () => {
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch (e) { db = null; }
  S.db = db;
  if (!db) {
    try {
      const r = await fetch('data.json', { cache: 'no-store' });
      if (r.ok) { const d = await r.json(); S.plants = (d.plants || []).sort((a, b) => String(a.addedAt || '').localeCompare(String(b.addedAt || ''))); S.week = d.week || null; S.ro = true; document.body.classList.add('ro');
        try { S.ticks = (S.week && JSON.parse(localStorage.getItem('orchid-ticks:' + S.week.id) || '{}')) || {}; } catch (e) { S.ticks = {}; } }
    } catch (e) { /* no snapshot available */ }
    S.ready = true; render(); return;
  }
  S.ready = true;
  db.collection('plants').onSnapshot(snap => {
    S.plants = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.addedAt || '').localeCompare(String(b.addedAt || '')));
    if (S.focus) { const fp = S.plants.find(x => x.id === S.focus); if (fp) { S.idx[catOf(fp)] = plantsIn(catOf(fp)).indexOf(fp); S.focus = null; } }
    softRender();
  }, () => {});
  db.collection('weeks').orderBy('weekOf', 'desc').limit(1).onSnapshot(snap => {
    const d = snap.docs[0], w = d ? { id: d.id, ...d.data() } : null;
    if ((w && w.id) !== (S.week && S.week.id)) {
      if (S.unTicks) S.unTicks();
      S.ticks = {};
      if (w) S.unTicks = db.doc('ticks/' + w.id).onSnapshot(t => { S.ticks = (t.exists && t.data().done) || {}; softRender(); }, () => {});
    }
    S.week = w; softRender();
  }, () => softRender());
})();
</script>
</body>
