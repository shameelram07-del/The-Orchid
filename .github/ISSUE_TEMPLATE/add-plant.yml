name: Add a plant
description: Add a new plant to The Orchid. It appears on the site in a minute or two.
title: "Add plant"
body:
  - type: input
    id: name
    attributes:
      label: Plant name
      placeholder: e.g. Kentia palm
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Fruit
        - Flowers
        - Palms
        - Foliage
        - Succulents
        - Herbs & veg
    validations:
      required: true
  - type: input
    id: spot
    attributes:
      label: Where is it?
      placeholder: e.g. Pot by the deck
  - type: markdown
    attributes:
      value: "Care details, pet safety and its weekly jobs are filled in automatically on Saturday morning."
